version: '3.8'

services:
  # ============================================================================
  # 1. Banco de Dados PostgreSQL com pgvector (Cérebro + RAG + Vendas)
  # ============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: loja_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loja_network

  # ============================================================================
  # 2. Redis (Fila de Tarefas e Cache de Alta Velocidade)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: loja_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loja_network

  # ============================================================================
  # 3. n8n (Motor de Automações & Agentes 24h)
  # ============================================================================
  n8n:
    image: n8nio/n8n:latest
    container_name: loja_n8n
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_POSTGRESDB_SCHEMA=public
      - EXECUTIONS_MODE=regular
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - WEBHOOK_URL=https://${DOMAIN_N8N:-n8n.marcaopersonal.com}/
      - N8N_HOST=${DOMAIN_N8N:-n8n.marcaopersonal.com}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - N8N_COMMUNITY_PACKAGES_ENABLED=true
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - loja_network

  # ============================================================================
  # 4. Painel Web de Comando & Aprovações (admin.marcaopersonal.com)
  # ============================================================================
  admin_panel:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    container_name: loja_admin_panel
    restart: always
    depends_on:
      - postgres
    environment:
      - PORT=3000
      - DOMAIN_ADMIN=${DOMAIN_ADMIN:-admin.marcaopersonal.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - loja_network

  # ============================================================================
  # 5. Loja & Landing Page Oficial (marcaopersonal.com)
  # ============================================================================
  site:
    build:
      context: ./apps/site
      dockerfile: Dockerfile
    container_name: loja_site
    restart: always
    environment:
      - PORT=3000
    networks:
      - loja_network

  # ============================================================================
  # 6. Evolution API v2 (WhatsApp Oficial para Sofia e Davi)
  # ============================================================================
  evolution_api:
    image: evoapicloud/evolution-api:v2.2.3
    container_name: loja_evolution_api
    restart: always
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SERVER_URL=https://${DOMAIN_EVOLUTION:-evolution.marcaopersonal.com}
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - CONFIG_SESSION_PHONE_VERSION=2.3000.1043857760
      - CONFIG_SESSION_PHONE_CLIENT=Chrome
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - WPP_LID_MODE=false
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=evolution
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_v2
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://:${REDIS_PASSWORD}@redis:6379/1
      - CACHE_REDIS_PREFIX_KEY=evolution
      - LOG_LEVEL=ERROR,WARN,DEBUG,INFO,LOG,VERBOSE,DARK,WEBHOOKS
      - LOG_COLOR=true
      - LOG_BAILEYS=error
      - QRCODE_LIMIT=30
      - WEBSOCKET_ENABLED=true
      - WEBSOCKET_GLOBAL_EVENTS=true
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - loja_network

  # ============================================================================
  # 7. Motor de Inteligência & Protocolo Marcão 360° (Python FastAPI)
  # ============================================================================
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: loja_api
    restart: always
    environment:
      - PORT=8000
      - SUPABASE_URL=https://qkopgftfrfftoyndhhfj.supabase.co
      - SUPABASE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    networks:
      - loja_network

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  evolution_instances:

networks:
  loja_network:
    driver: bridge
