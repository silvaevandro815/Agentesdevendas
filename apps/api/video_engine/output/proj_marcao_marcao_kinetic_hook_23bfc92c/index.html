<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #060d1b;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 220px 60px;
      background: radial-gradient(circle at center, #0b1a30 0%, #030712 100%);
      color: #ffffff;
    }
    .top-box { width: 100%; display: flex; justify-content: center; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 16px 36px;
      background: rgba(0, 229, 255, 0.15);
      border: 2px solid #00e5ff;
      border-radius: 9999px;
      font-size: 26px;
      font-weight: 900;
      color: #00e5ff;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }
    .center-box {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .hero-title {
      font-size: 80px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      line-height: 1.12;
      max-width: 960px;
      color: #ffffff;
      text-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
    }
    .hero-hl {
      display: inline-block;
      background: #facc15;
      color: #000000;
      padding: 6px 28px;
      border-radius: 8px;
      margin-top: 14px;
      text-shadow: none;
      box-shadow: 0 0 40px rgba(250, 204, 21, 0.4);
    }
    .bottom-box { width: 100%; display: flex; justify-content: center; }
    .subtext {
      font-size: 32px;
      font-weight: 700;
      color: #94a3b8;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      max-width: 860px;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="3.5" data-width="1080" data-height="1920">
    <div class="top-box">
      <div id="badge" class="clip badge" data-start="0" data-duration="3.5">⚡ METODOLOGIA MARCÃO PERSONAL</div>
    </div>
    
    <div class="center-box">
      <div id="title" class="clip hero-title" data-start="0" data-duration="3.5">
        VOCÊ TOMA CREATINA <br/><span class="hero-hl">ERRADO?</span>
      </div>
    </div>

    <div class="bottom-box">
      <div id="sub" class="clip subtext" data-start="0" data-duration="3.5">
        O ERRO QUE DESTRÓI SEUS GANHOS SEM VOCÊ PERCEBER
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    tl.fromTo('#badge', { opacity: 0.7, scale: 0.95 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(2)' }, 0);
    tl.fromTo('#title', { y: 40, opacity: 0.6, filter: 'blur(8px)' }, { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.45, ease: 'power4.out' }, 0.15);
    tl.fromTo('#sub', { y: 25, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: 'power2.out' }, 0.6);
    tl.to('.hero-hl', { scale: 1.08, duration: 0.4, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 1.8);

    window.__timelines['main'] = tl;
    tl.seek(0);
  </script>
</body>
</html>
